name: Publish weather dashboard

on:
  workflow_dispatch:
    inputs:
      send_notification:
        description: Send the daily Pushover message after publishing
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Retry every 15 minutes around 05:00 Copenhagen time. The gate sends only
    # once per local date and records successful delivery on a state branch.
    - cron: "7,22,37,52 3,4 * * *"

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      notify: ${{ steps.gate.outputs.notify }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_date="$(TZ=Europe/Copenhagen date +%F)"
            local_hour="$(TZ=Europe/Copenhagen date +%H)"
            git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
            last_sent="$(git show origin/weather-notification-state:last_notification_date 2>/dev/null || true)"
            if [ "$local_hour" -ge 5 ] && [ "$local_hour" -lt 12 ] && [ "$last_sent" != "$local_date" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "notify=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ] || \
               { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; } || \
               { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_notification }}" = "true" ]; }; then
              echo "notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "notify=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: release
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 1
          extra-packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
            any::knitr
            any::rmarkdown
      - name: Validate weather access
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Quarto site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: quarto render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  notify:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - name: Install notification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); install.packages(c("httr", "jsonlite", "suncalc"), lib = lib, repos = "https://cloud.r-project.org"); stopifnot(requireNamespace("httr", quietly = TRUE))'
      - name: Send daily weather forecast
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
        run: Rscript --vanilla scripts/send-pushover.R

  record-notification-delivery:
    needs: notify
    if: needs.notify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Record successful daily delivery
        shell: bash
        run: |
          local_date="$(TZ=Europe/Copenhagen date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/weather-notification-state; then
            git checkout -B weather-notification-state origin/weather-notification-state
          else
            git checkout --orphan weather-notification-state
            git rm -rf .
          fi
          printf '%s\n' "$local_date" > last_notification_date
          git add last_notification_date
          git commit -m "Record weather notification for $local_date"
          git push origin weather-notification-state

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
