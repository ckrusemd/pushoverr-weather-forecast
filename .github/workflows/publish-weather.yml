name: Publish weather dashboard

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 05:07 and 15:07 Copenhagen time, expressed as both CET and CEST UTC hours.
    - cron: "7 3,4,13,14 * * *"

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_hour="$(TZ=Europe/Copenhagen date +%H)"
            if [ "$local_hour" = "05" ] || [ "$local_hour" = "15" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: release
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 1
          extra-packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
            any::knitr
            any::rmarkdown
      - name: Validate weather access
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Quarto site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: quarto render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
