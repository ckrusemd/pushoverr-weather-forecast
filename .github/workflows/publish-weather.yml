name: Publish weather dashboard

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    # Hourly Pages watchdog; notification delivery has its own workflow.
    - cron: "5 3,4 * * *"
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_date="$(TZ=Europe/Copenhagen date +%F)"
            local_hour="$(TZ=Europe/Copenhagen date +%H)"
            if git ls-remote --exit-code --heads origin refs/heads/weather-pages-state > /dev/null; then
              git fetch origin weather-pages-state:refs/remotes/origin/weather-pages-state
              pages_sent="$(git show origin/weather-pages-state:last_deployment_date)"
              if [[ ! "$pages_sent" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
                ! canonical_date="$(TZ=Europe/Copenhagen date -d "$pages_sent" +%F 2>/dev/null)" ||
                [[ "$canonical_date" != "$pages_sent" ]]; then
                echo "Deployment state contains an invalid date; refusing to reset it." >&2
                exit 1
              fi
            else
              status=$?
              if [ "$status" -ne 2 ]; then
                echo "Could not read deployment state; refusing to reset it." >&2
                exit "$status"
              fi
              pages_sent=""
            fi
            if [ "$((10#$local_hour))" -ge 5 ] && [ "$pages_sent" != "$local_date" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              publish=true
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              publish=false
            fi
            echo "Pages gate: date=$local_date hour=$local_hour recorded=$pages_sent publish=$publish"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Pages gate: event=${{ github.event_name }} publish=true"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: weather-dashboard-2
          # Explicit packages avoid discovering dependencies in archived Rmd files.
          packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
            any::knitr
            any::rmarkdown
          dependencies: 'NA'
          install-quarto: false
          install-pandoc: false
      - name: Run offline tests
        env:
          WEATHER_FIXTURE_PATH: ${{ github.workspace }}/tests/fixtures/weather.json
          # Full fixture/standalone render scenarios run in validation; this
          # job runs unit tests and then renders the live site once.
          QUARTO_BIN: ''
        run: bash scripts/run-tests.sh
      - name: Validate weather access
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Quarto site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
          WEATHER_FIXTURE_PATH: ''
        run: quarto render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  record-deployment:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Record successful daily deployment
        shell: bash
        run: |
          set -euo pipefail
          local_date="$(TZ=Europe/Copenhagen date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin refs/heads/weather-pages-state > /dev/null; then
            git fetch origin weather-pages-state:refs/remotes/origin/weather-pages-state
            recorded_date="$(git show origin/weather-pages-state:last_deployment_date)"
            if [[ ! "$recorded_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] ||
              ! canonical_date="$(TZ=Europe/Copenhagen date -d "$recorded_date" +%F 2>/dev/null)" ||
              [[ "$canonical_date" != "$recorded_date" ]]; then
              echo "Deployment state contains an invalid date; refusing to reset it." >&2
              exit 1
            fi
            git checkout -B weather-pages-state origin/weather-pages-state
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not read deployment state; refusing to reset it." >&2
              exit "$status"
            fi
            git checkout --orphan weather-pages-state
            git rm -rf .
          fi
          printf '%s\n' "$local_date" > last_deployment_date
          git add last_deployment_date
          if git diff --cached --quiet; then
            echo "Deployment date is unchanged."
          else
            git commit -m "Record weather deployment for $local_date"
            git push origin weather-pages-state
          fi
