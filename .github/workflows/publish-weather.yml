name: Publish weather dashboard

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Hourly Pages watchdog; notification delivery has its own workflow.
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_date="$(TZ=Europe/Copenhagen date +%F)"
            local_hour="$(TZ=Europe/Copenhagen date +%H)"
            git fetch origin weather-pages-state:refs/remotes/origin/weather-pages-state 2>/dev/null || true
            pages_sent="$(git show origin/weather-pages-state:last_deployment_date 2>/dev/null || true)"
            if [ "$((10#$local_hour))" -ge 5 ] && [ "$pages_sent" != "$local_date" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: release
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 1
          extra-packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
            any::knitr
            any::rmarkdown
      - name: Test notification reconciliation
        run: Rscript --vanilla tests/test-notification.R
      - name: Validate weather access
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Quarto site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: quarto render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  record-deployment:
    needs: deploy
    if: github.event_name == 'schedule' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Record successful daily deployment
        shell: bash
        run: |
          local_date="$(TZ=Europe/Copenhagen date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin weather-pages-state:refs/remotes/origin/weather-pages-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/weather-pages-state; then
            git checkout -B weather-pages-state origin/weather-pages-state
          else
            git checkout --orphan weather-pages-state
            git rm -rf .
          fi
          printf '%s\n' "$local_date" > last_deployment_date
          git add last_deployment_date
          git commit -m "Record weather deployment for $local_date"
          git push origin weather-pages-state
