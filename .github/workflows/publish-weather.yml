name: Publish weather dashboard

on:
  workflow_dispatch:
    inputs:
      send_notification:
        description: Send the daily Pushover message after publishing
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Retry every 15 minutes across the CET/CEST UTC windows for 05:00 and
    # 15:00 Copenhagen time. The gate picks the slot using local time.
    - cron: "7,22,37,52 3,4,13,14 * * *"

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      notify: ${{ steps.gate.outputs.notify }}
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            local_date="$(TZ=Europe/Copenhagen date +%F)"
            local_hour="$(TZ=Europe/Copenhagen date +%H)"
            case "$local_hour" in
              05|06|07) slot="morning" ;;
              15|16|17) slot="afternoon" ;;
              *) slot="" ;;
            esac
            git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
            state="$(git show origin/weather-notification-state:delivery_state 2>/dev/null || true)"
            morning_sent="$(printf '%s\n' "$state" | sed -n 's/^morning=//p')"
            afternoon_sent="$(printf '%s\n' "$state" | sed -n 's/^afternoon=//p')"
            if [ -z "$state" ]; then
              morning_sent="$(git show origin/weather-notification-state:last_notification_date 2>/dev/null || true)"
            fi
            slot_sent="$morning_sent"
            if [ "$slot" = "afternoon" ]; then slot_sent="$afternoon_sent"; fi
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            if [ -n "$slot" ] && [ "$slot_sent" != "$local_date" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "notify=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ] || \
               { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; } || \
               { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_notification }}" = "true" ]; }; then
              echo "notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "notify=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: release
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 1
          extra-packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
            any::knitr
            any::rmarkdown
      - name: Validate weather access
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Quarto site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: quarto render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  notify:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - name: Install notification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'lib <- Sys.getenv("R_LIBS_USER"); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); install.packages(c("httr", "jsonlite", "suncalc"), lib = lib, repos = "https://cloud.r-project.org"); stopifnot(requireNamespace("httr", quietly = TRUE))'
      - name: Send daily weather forecast
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
        run: Rscript --vanilla scripts/send-pushover.R

  record-notification-delivery:
    needs: notify
    if: github.event_name == 'schedule' && needs.notify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Record successful daily delivery
        shell: bash
        run: |
          local_date="$(TZ=Europe/Copenhagen date +%F)"
          slot="${{ needs.schedule-gate.outputs.slot }}"
          if [ "$slot" != "morning" ] && [ "$slot" != "afternoon" ]; then
            echo "Unexpected notification slot: $slot" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/weather-notification-state; then
            git checkout -B weather-notification-state origin/weather-notification-state
          else
            git checkout --orphan weather-notification-state
            git rm -rf .
          fi
          state="$(git show origin/weather-notification-state:delivery_state 2>/dev/null || true)"
          morning_sent="$(printf '%s\n' "$state" | sed -n 's/^morning=//p')"
          afternoon_sent="$(printf '%s\n' "$state" | sed -n 's/^afternoon=//p')"
          if [ -z "$state" ]; then
            morning_sent="$(git show origin/weather-notification-state:last_notification_date 2>/dev/null || true)"
          fi
          if [ "$slot" = "morning" ]; then morning_sent="$local_date"; else afternoon_sent="$local_date"; fi
          printf 'morning=%s\nafternoon=%s\n' "$morning_sent" "$afternoon_sent" > delivery_state
          git add delivery_state
          git commit -m "Record $slot weather notification for $local_date"
          git push origin weather-notification-state

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
