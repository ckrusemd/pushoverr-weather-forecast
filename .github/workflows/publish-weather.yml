name: Publish weather dashboard

on:
  workflow_dispatch:
    inputs:
      send_notification:
        description: Send the daily Pushover message after publishing
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 05:00 Europe/Copenhagen: both UTC candidates are gated below for CET/CEST.
    - cron: "0 3 * * *"
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      notify: ${{ steps.gate.outputs.notify }}
    steps:
      - id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # GitHub cron is UTC and may start a scheduled run late. Determine
            # the UTC hour that corresponds to 05:00 Copenhagen time today,
            # then use the matching cron entry instead of the runner's current
            # hour (which may be several hours after the scheduled time).
            local_date="$(TZ=Europe/Copenhagen date +%F)"
            local_offset="$(TZ=Europe/Copenhagen date -d "$local_date 05:00" +%z)"
            case "$local_offset" in
              +0100) expected_utc_hour="04" ;;
              +0200) expected_utc_hour="03" ;;
              *) echo "Unsupported Copenhagen UTC offset: $local_offset" >&2; exit 1 ;;
            esac
            scheduled_utc_hour="${{ github.event.schedule }}"
            scheduled_utc_hour="${scheduled_utc_hour%% *}"
            if [ "$scheduled_utc_hour" = "$expected_utc_hour" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "notify=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "push" ] || \
               { [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; } || \
               { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_notification }}" = "true" ]; }; then
              echo "notify=true" >> "$GITHUB_OUTPUT"
            else
              echo "notify=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: release
      - name: Install notification dependencies
        run: Rscript -e 'install.packages(c("httr", "jsonlite", "suncalc"), repos = "https://cloud.r-project.org")'
            any::ggplot2
            any::knitr
            any::rmarkdown
      - name: Validate weather access
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Quarto site
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: quarto render
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  notify:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 1
          extra-packages: |
            any::httr
            any::jsonlite
            any::suncalc
      - name: Send daily weather forecast
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
        run: Rscript --vanilla scripts/send-pushover.R

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
