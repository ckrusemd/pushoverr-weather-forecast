name: Validate weather dashboard

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: weather-validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Copenhagen
      WEATHER_FIXTURE_PATH: ${{ github.workspace }}/tests/fixtures/weather.json
      OPENWEATHERMAP_APIKEY: ''
      PUSHOVER_APPKEY: ''
      PUSHOVER_USERKEY: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.19'
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: weather-dashboard-2
          # Tests and the complete site need these packages, not archived Rmd deps.
          packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
            any::knitr
            any::rmarkdown
          dependencies: 'NA'
          install-quarto: false
          install-pandoc: false
      - name: Run offline tests
        run: bash scripts/run-tests.sh
      - name: Render complete site from fixture
        shell: bash
        run: |
          set -euo pipefail
          test -r "$WEATHER_FIXTURE_PATH"
          test -f scripts/prepare-dashboard.R
          test -z "$OPENWEATHERMAP_APIKEY$PUSHOVER_APPKEY$PUSHOVER_USERKEY"
          quarto render
