name: Daily Pushover weather
run-name: Weather Pushover reconciliation • ${{ inputs.dispatch_id || github.event_name }} • ${{ github.run_id }}

on:
  schedule:
    # Free hosted triggers own 05:00/15:00 Copenhagen slots and :10/:30 retries.
    # GitHub cron is only an hourly state-aware recovery watchdog.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      scheduled_delivery:
        description: Apply time and accepted-slot gates to an external scheduled call
        required: false
        default: false
        type: boolean
      mode:
        description: Reconcile due slots, force one slot, or preview due slots
        required: true
        default: reconcile
        type: choice
        options: [reconcile, force, dry-run]
      slot:
        description: Slot used by force mode
        required: true
        default: morning
        type: choice
        options: [morning, afternoon]
      dispatch_id:
        description: Correlation ID used by the external scheduler
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: weather-pushover-reconciliation
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notify: ${{ steps.gate.outputs.notify }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'reconcile' }}
          REQUESTED_SLOT: ${{ inputs.slot || 'morning' }}
          SCHEDULED_DELIVERY: ${{ inputs.scheduled_delivery || false }}
        run: |
          set -euo pipefail
          state_path="$RUNNER_TEMP/notification-gate-state.json"
          bash scripts/notification-state.sh load "$state_path"
          bash scripts/notification-gate.sh "$state_path" "$GITHUB_EVENT_NAME" "$REQUESTED_MODE" "$REQUESTED_SLOT" "" "" "$SCHEDULED_DELIVERY"

  reconcile:
    needs: gate
    if: needs.gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Load delivery state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          state_path="$RUNNER_TEMP/notification-state.json"
          bash scripts/notification-state.sh load "$state_path"
          echo "path=$state_path" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          cache-version: weather-notification-chart-1
          packages: |
            any::httr
            any::jsonlite
            any::suncalc
            any::ggplot2
          dependencies: 'NA'
          install-quarto: false
          install-pandoc: false
      - name: Reconcile Pushover deliveries
        id: notify
        continue-on-error: true
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
          NOTIFICATION_STATE_PATH: ${{ steps.state.outputs.path }}
          REQUESTED_MODE: ${{ inputs.mode || 'reconcile' }}
          REQUESTED_SLOT: ${{ inputs.slot || 'morning' }}
        run: Rscript --vanilla scripts/send-pushover.R --mode="$REQUESTED_MODE" --slot="$REQUESTED_SLOT" --state="$NOTIFICATION_STATE_PATH"
      - name: Persist accepted deliveries
        if: always() && steps.state.outcome == 'success' && (steps.notify.outcome == 'success' || steps.notify.outcome == 'failure') && (github.event_name == 'schedule' || inputs.scheduled_delivery || inputs.mode == 'reconcile')
        shell: bash
        env:
          STATE_PATH: ${{ steps.state.outputs.path }}
        run: |
          set -euo pipefail
          bash scripts/notification-state.sh persist "$STATE_PATH"
      - name: Collect accepted state for recovery
        id: archive
        if: always() && steps.state.outcome == 'success'
        shell: bash
        env:
          STATE_PATH: ${{ steps.state.outputs.path }}
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/notification-recovery"
          mkdir -p "$archive_path"
          present=false
          for path in "$STATE_PATH" "$STATE_PATH.accepted.json"; do
            if [ -f "$path" ]; then
              cp "$path" "$archive_path/"
              present=true
            fi
          done
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "path=$archive_path" >> "$GITHUB_OUTPUT"
      - name: Archive accepted state
        if: always() && steps.archive.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notification-accepted-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Fail when reconciliation failed
        if: always() && steps.notify.outcome == 'failure'
        run: |
          echo "One or more due Pushover deliveries failed after retries." >&2
          exit 1
