name: Daily Pushover weather
run-name: Weather Pushover reconciliation • ${{ inputs.dispatch_id || github.event_name }} • ${{ github.run_id }}

on:
  schedule:
    # Target each slot in CET and CEST, with hourly checks to recover delayed
    # or skipped cron events. No runner waits for a future time.
    - cron: "5 3,4,13,14 * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Reconcile due slots, force one slot, or preview due slots
        required: true
        default: reconcile
        type: choice
        options: [reconcile, force, dry-run]
      slot:
        description: Slot used by force mode
        required: true
        default: morning
        type: choice
        options: [morning, afternoon]
      dispatch_id:
        description: Correlation ID used by the external scheduler
        required: false
        default: manual
        type: string

permissions:
  contents: read

concurrency:
  group: weather-pushover-reconciliation
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      notify: ${{ steps.gate.outputs.notify }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - id: gate
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'reconcile' }}
          REQUESTED_SLOT: ${{ inputs.slot || 'morning' }}
        run: |
          set -euo pipefail
          local_date="$(TZ=Europe/Copenhagen date +%F)"
          local_minute="$(TZ=Europe/Copenhagen date +%H%M)"
          git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
          state="$(git show origin/weather-notification-state:notification-state.json 2>/dev/null || true)"
          if [ -z "$state" ]; then
            state="$(git show origin/weather-notification-state:delivery_state 2>/dev/null || true)"
          fi
          morning_sent="$(printf '%s' "$state" | jq -r --arg date "$local_date" '.deliveries[$date].morning.request_id // empty' 2>/dev/null || true)"
          if [ -z "$morning_sent" ]; then
            legacy_morning="$(printf '%s\n' "$state" | sed -n 's/^morning=//p' | head -n 1)"
            [ "$legacy_morning" != "$local_date" ] || morning_sent=legacy
          fi
          afternoon_sent="$(printf '%s' "$state" | jq -r --arg date "$local_date" '.deliveries[$date].afternoon.request_id // empty' 2>/dev/null || true)"
          if [ -z "$afternoon_sent" ]; then
            legacy_afternoon="$(printf '%s\n' "$state" | sed -n 's/^afternoon=//p' | head -n 1)"
            [ "$legacy_afternoon" != "$local_date" ] || afternoon_sent=legacy
          fi
          notify=false
          if [ "${{ github.event_name }}" != "schedule" ]; then
            notify=true
          else
            if [ "$((10#$local_minute))" -ge 500 ] && [ "$morning_sent" = "" ]; then notify=true; fi
            if [ "$((10#$local_minute))" -ge 900 ] && [ "$afternoon_sent" = "" ]; then notify=true; fi
          fi
          echo "notify=$notify" >> "$GITHUB_OUTPUT"
          echo "Weather gate: date=$local_date minute=$local_minute mode=$REQUESTED_MODE notify=$notify"

  reconcile:
    needs: gate
    if: needs.gate.outputs.notify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          cache-version: 2
          extra-packages: |
            any::httr
            any::jsonlite
            any::suncalc
      - name: Load delivery state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          state_path="$RUNNER_TEMP/notification-state.json"
          git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
          if git show origin/weather-notification-state:notification-state.json > "$state_path" 2>/dev/null; then
            echo "Loaded versioned notification state."
          elif git show origin/weather-notification-state:delivery_state > "$state_path" 2>/dev/null; then
            echo "Loaded legacy notification state for migration."
          else
            printf '{"schema_version":1,"deliveries":{}}\n' > "$state_path"
            echo "Created empty notification state."
          fi
          echo "path=$state_path" >> "$GITHUB_OUTPUT"
      - name: Reconcile Pushover deliveries
        id: notify
        continue-on-error: true
        env:
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
          NOTIFICATION_STATE_PATH: ${{ steps.state.outputs.path }}
          REQUESTED_MODE: ${{ inputs.mode || 'reconcile' }}
          REQUESTED_SLOT: ${{ inputs.slot || 'morning' }}
        run: Rscript --vanilla scripts/send-pushover.R --mode="$REQUESTED_MODE" --slot="$REQUESTED_SLOT" --state="$NOTIFICATION_STATE_PATH"
      - name: Persist accepted deliveries
        if: always() && steps.notify.outcome != 'skipped' && (github.event_name == 'schedule' || inputs.mode == 'reconcile')
        shell: bash
        env:
          STATE_PATH: ${{ steps.state.outputs.path }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin weather-notification-state:refs/remotes/origin/weather-notification-state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/weather-notification-state; then
            git checkout -B weather-notification-state origin/weather-notification-state
          else
            git checkout --orphan weather-notification-state
            git rm -rf . || true
          fi
          cp "$STATE_PATH" notification-state.json
          git add notification-state.json
          if git diff --cached --quiet; then
            echo "Delivery state is unchanged."
          else
            git commit -m "Record accepted weather notifications"
            git push origin weather-notification-state
          fi
      - name: Fail when reconciliation failed
        if: always() && steps.notify.outcome == 'failure'
        run: |
          echo "One or more due Pushover deliveries failed after retries." >&2
          exit 1
