on:
  workflow_dispatch:
  push:
     branches:
       - master
  schedule:
    # GitHub cron is UTC: 03:00 UTC during CEST and 04:00 UTC during CET.
    - cron:  '0 3 * * *'
    - cron:  '0 4 * * *'

name: pushoverr-weather-example

permissions:
  contents: read

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Check Copenhagen schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif { [ "${{ github.event.schedule }}" = "0 3 * * *" ] && [ "$(TZ=Europe/Copenhagen date +%Z)" = "CEST" ]; } || \
               { [ "${{ github.event.schedule }}" = "0 4 * * *" ] && [ "$(TZ=Europe/Copenhagen date +%Z)" = "CET" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  bookdown:
    name: pushoverr
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    #runs-on: macOS-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate required secrets
        env:
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        run: |
          test -n "$PUSHOVER_APPKEY"
          test -n "$PUSHOVER_USERKEY"
          test -n "$OPENWEATHERMAP_APIKEY"
      - name: Render Book from Action
        uses: ckrusemd/rmarkdown-action@96c3cca0304bca8d7efc183eaa12415bb87980a7 # v1.1
        env:
          PUSHOVER_APPKEY: ${{ secrets.PUSHOVER_APPKEY }}
          PUSHOVER_USERKEY: ${{ secrets.PUSHOVER_USERKEY }}
          OPENWEATHERMAP_APIKEY: ${{ secrets.OPENWEATHERMAP_APIKEY }}
        with:
           input_file: index.Rmd
